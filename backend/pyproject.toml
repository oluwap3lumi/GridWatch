[project]
name = "gridwatch-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "geoalchemy2>=0.17,<1",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "scikit-learn>=1.6,<2",
    "shap>=0.48,<1",
    "uvicorn>=0.34,<1",
    "xgboost>=3,<4; sys_platform != 'linux'",
    "xgboost-cpu>=3,<4; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8,<10", "pre-commit>=4,<5", "pandas-stubs>=2.2,<4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "shap.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment: &api_environment
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEED_RANDOM: ${SEED_RANDOM:-42}
      SEED_ASSET_COUNT: ${SEED_ASSET_COUNT:-3000}
      SEED_FEEDER_COUNT: ${SEED_FEEDER_COUNT:-20}
      SEED_TRANSFORMER_COUNT: ${SEED_TRANSFORMER_COUNT:-700}
      SEED_DAYS: ${SEED_DAYS:-730}
      SEED_AS_OF: ${SEED_AS_OF:-2025-12-31}
      SEED_BBOX: ${SEED_BBOX:-3.25,6.42,3.55,6.65}
      TRAIN_RANDOM: ${TRAIN_RANDOM:-42}
      MODEL_ARTIFACT_DIR: /app/ml/artifacts
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      UPLOAD_STAGING_DIR: /app/uploads/staging
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      UPLOAD_MAX_FEATURES: ${UPLOAD_MAX_FEATURES:-100000}
      UPLOAD_MAX_EXPANDED_BYTES: ${UPLOAD_MAX_EXPANDED_BYTES:-262144000}
      UPLOAD_MAX_ZIP_FILES: ${UPLOAD_MAX_ZIP_FILES:-32}
      UPLOAD_MAX_ZIP_RATIO: ${UPLOAD_MAX_ZIP_RATIO:-100}
      UPLOAD_TTL_SECONDS: ${UPLOAD_TTL_SECONDS:-86400}
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - upload_staging:/app/uploads/staging
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  import-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    entrypoint: ["python", "-m", "app.services.import_worker"]
    environment: *api_environment
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - upload_staging:/app/uploads/staging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/gridwatch-import-worker'); assert p.exists() and time.time()-p.stat().st_mtime<120"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  test-db:
    profiles: ["test"]
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: gridwatch_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test-only-placeholder}
      POSTGRES_DB: gridwatch_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
  test-api:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      POSTGRES_USER: gridwatch_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test-only-placeholder}
      POSTGRES_DB: gridwatch_test
      POSTGRES_HOST: test-db
      POSTGRES_PORT: "5432"
      GRIDWATCH_INTEGRATION: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    depends_on:
      test-db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  upload_staging:

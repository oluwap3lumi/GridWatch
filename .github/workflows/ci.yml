name: GridWatch CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gridwatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make setup
      - name: Configure local synthetic stack
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          Path('.env').write_text(Path('.env.example').read_text().replace('change-me-local-only', password))
          PY
      - run: make lint
      - name: Verify generator-backed synthetic upload samples
        run: uv run --project backend python -m data.generator.samples --check
      - run: make test
      - run: make build
      - name: Verify generated API types
        run: |
          make types
          git diff --exit-code -- frontend/src/api/generated.ts
      - name: Stack smoke test
        run: |
          make up
          make seed
          make train
          make train
          make verify-train
          make smoke
      - name: Upload sample acceptance (synthetic CI deployment only)
        env:
          GRIDWATCH_UPLOAD_ACCEPTANCE_URL: http://localhost:8000
        run: uv run --project backend python scripts/upload_acceptance.py
      - name: Stack diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

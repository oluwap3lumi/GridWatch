name: GridWatch CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make setup
      - run: make lint
      - run: make test
      - run: make build
      - name: Verify generated API types
        run: |
          make types
          git diff --exit-code -- frontend/src/api/generated.ts
      - name: Stack smoke test
        run: |
          cp .env.example .env
          make up
          make smoke
      - name: Stack diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down
